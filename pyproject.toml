[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nilmtcmilp"
version = "0.1.0"
description = "TMILP-1bin-project: MILP-based non-intrusive load monitoring model (Python port of the MATLAB implementation)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "NILM-MILP contributors" }]
keywords = ["nilm", "energy disaggregation", "milp", "optimization", "tmilp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "scikit-learn>=1.1",
]

[project.optional-dependencies]
copt = ["coptpy"]
plot = ["matplotlib"]
all = ["coptpy", "matplotlib"]

[tool.setuptools.packages.find]
include = ["nilmtcmilp*"]
